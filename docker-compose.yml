version: '3.8'

# PostgreSQL and MinIO are external (configured in .env).

services:
  redis:
    image: redis:8-alpine
    container_name: be_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  omniroute:
    image: litellm/litellm:main-latest
    container_name: omniroute_gateway
    restart: always
    ports:
      - "8090:4000"
    volumes:
      - ./omniroute/config.yaml:/app/config.yaml
    command: [ "--config", "/app/config.yaml", "--port", "4000", "--detailed_debug" ]
    environment:
      - LITELLM_MASTER_KEY=sk-omniroute-secret-key

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: be_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENV_FILE=.env
      # Container-local services (Postgres & MinIO come from .env)
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - AI_BASE_URL=http://omniroute:4000
    volumes:
      - .env:/app/.env
      - ./omniroute:/app/omniroute
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
